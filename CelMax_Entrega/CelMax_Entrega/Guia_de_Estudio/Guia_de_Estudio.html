<script id="data" type="application/json">[{"id": "00", "title": "Guía de estudio — Proyecto CelMax", "md": "# Guía de estudio — Proyecto CelMax\n\nEsta carpeta explica **cómo funciona CelMax** y **cómo estudiarlo**, para que todo el grupo\npueda entender el código, ejecutarlo y defenderlo en la exposición.\n\n> Consejo: abre **`Guia_de_Estudio.html`** en el navegador. Ahí está todo junto, con los\n> diagramas dibujados (necesita internet para dibujarlos). Los archivos `.md` tienen el mismo\n> contenido y también se ven en VS Code o IntelliJ.\n\n## Contenido del ZIP\n\n```\nCelMax_Entrega/\n├── Proyecto/                 ← el código (abrir la carpeta Proyecto/CelMax en el IDE)\n│   ├── README.md\n│   ├── db/                   ← modelo de la BD, script SQL y diccionario de datos\n│   └── CelMax/               ← proyecto Maven (pom.xml, src/, docs/)\n└── Guia_de_Estudio/          ← esta carpeta\n    ├── 00_LEEME.md                       (este archivo)\n    ├── 01_Plan_de_estudio.md             qué estudiar y en qué orden\n    ├── 02_Vision_general.md              qué hace la aplicación\n    ├── 03_Arquitectura.md                capas, paquetes y patrones\n    ├── 04_Base_de_datos.md               tablas, relaciones y reglas\n    ├── 05_Recorrido_del_codigo.md        qué pasa al hacer login, guardar y vender\n    ├── 06_Conceptos_POO.md               POO aplicada con ejemplos del código\n    ├── 07_Ejecutar_y_errores_comunes.md  instalación, credenciales y soluciones\n    ├── 08_Preguntas_y_ejercicios.md      preguntas de repaso y práctica\n    └── Guia_de_Estudio.html              todo lo anterior en una sola página\n```\n\n## Inicio rápido (5 minutos)\n\n1. Instalar **JDK 21** y **Maven** (o usar `mvnw.cmd` que viene en el proyecto).\n2. Abrir una terminal **dentro de** `Proyecto/CelMax` (donde está el `pom.xml`).\n3. Ejecutar `mvn javafx:run`.\n4. Entrar con **Isaac** / `Is@c5G#01` (Administrador).\n\n| Usuario | Contraseña | Perfil |\n|---------|------------|--------|\n| Isaac   | `Is@c5G#01`   | Administrador |\n| Jeremy  | `Jer*Pro15x`  | Gerente |\n| Bernabe | `Bern!Ultra7` | Vendedor |\n| Jhoner  | `Jh0n_Fold26` | Vendedor |\n\n## Orden recomendado de lectura\n\n`02 → 03 → 04 → 05 → 06`, siguiendo el **plan del archivo 01**, y al final `08` para repasar.\nSi algo no arranca, ve directo al `07`.\n"}, {"id": "01", "title": "1. Plan de estudio", "md": "# 1. Plan de estudio\n\nEl plan está pensado en **5 sesiones de 1 a 2 horas**. No hace falta memorizar el código:\nla idea es entender **qué hace cada capa y cómo viaja un dato** desde la pantalla hasta la\nbase de datos y de vuelta.\n\n```mermaid\nflowchart LR\n    S1[\"Sesión 1<br/>Usar la app\"] --> S2[\"Sesión 2<br/>Arquitectura\"]\n    S2 --> S3[\"Sesión 3<br/>Base de datos<br/>y repositorios\"]\n    S3 --> S4[\"Sesión 4<br/>Servicios,<br/>controladores y vistas\"]\n    S4 --> S5[\"Sesión 5<br/>Venta completa<br/>y repaso\"]\n```\n\n---\n\n## Sesión 1 — Conocer la aplicación como usuario\n\n**Objetivo:** saber qué hace el sistema antes de mirar el código.\n\n- [ ] Ejecutar el proyecto (ver `07_Ejecutar_y_errores_comunes.md`).\n- [ ] Entrar con los 3 perfiles (Isaac, Jeremy, Bernabe) y anotar qué menús ve cada uno.\n- [ ] Registrar un cliente nuevo y fijarse en el código que le asigna (`CLI-006`).\n- [ ] Probar una validación: poner un DNI de 5 dígitos y ver el mensaje en rojo.\n- [ ] Hacer una venta de 1 celular + 1 accesorio y revisar el historial.\n- [ ] Volver a *Inventario* y comprobar que el stock bajó.\n- [ ] Cambiar a estilo oscuro e idioma inglés desde el menú.\n\n**Leer:** `02_Vision_general.md`.\n\n## Sesión 2 — La arquitectura en capas\n\n**Objetivo:** entender por qué hay tantos paquetes y qué hace cada uno.\n\n- [ ] Leer `03_Arquitectura.md`.\n- [ ] Abrir `config/AppContext.java` y ubicar las 3 capas que registra.\n- [ ] Abrir `CelMax.java` y `App.java`: ¿cuál es el `main` y cuál carga el login?\n- [ ] Abrir `module-info.java` y explicar `requires` y `opens` con tus palabras.\n- [ ] Dibujar en papel el diagrama de capas sin mirar.\n\n## Sesión 3 — Base de datos y repositorios (JDBC)\n\n**Objetivo:** entender cómo se guardan y leen los datos.\n\n- [ ] Leer `04_Base_de_datos.md` y abrir `db/trabajo_celmax.architect` en SQL Power Architect.\n- [ ] Leer `schema_celmax.sql` y `data_celmax.sql`.\n- [ ] Leer `DatabaseConfig.java`: ¿cuándo se crean las tablas? ¿cuándo se cargan los datos?\n- [ ] Leer `SqlHelper.java` → `AbstractJpaRepository.java` → `ClienteRepository.java` (en ese orden).\n- [ ] Explicar qué hace `mapRow()` y qué hace `nextCode()`.\n\n## Sesión 4 — Servicios, controladores y vistas\n\n**Objetivo:** seguir el camino del botón **Guardar**.\n\n- [ ] Leer `ICrudGenericoService` y `CrudGenericoServiceImp`.\n- [ ] Leer `ClienteController.java` junto con `view/main_cliente.fxml` (fíjate en `fx:id` y `onAction`).\n- [ ] Leer `components/FormHelper.java` y `TableViewHelper.java`.\n- [ ] Leer la sección \"Guardar un cliente\" de `05_Recorrido_del_codigo.md`.\n- [ ] Ver en el modelo `Cliente.java` las anotaciones `@Pattern`, `@Email`, `@NotBlank`.\n\n## Sesión 5 — La venta completa y repaso final\n\n**Objetivo:** entender la parte más importante del negocio.\n\n- [ ] Leer la sección \"Registrar una venta\" de `05_Recorrido_del_codigo.md`.\n- [ ] Leer `VentaController` → `VentaServiceImp` → `VentaRepository.insert()`.\n- [ ] Explicar qué es una **transacción** y qué pasa si no hay stock (rollback).\n- [ ] Calcular a mano el IGV de una venta de S/ 1424 y compararlo con el sistema.\n- [ ] Leer `06_Conceptos_POO.md`.\n- [ ] Responder `08_Preguntas_y_ejercicios.md` sin mirar las respuestas.\n\n---\n\n## Reparto sugerido para la exposición\n\n| Integrante | Tema | Archivos clave |\n|------------|------|----------------|\n| 1 | Demo de la app y perfiles | Pantallas, `MenuMenuItemDaoImp` |\n| 2 | Arquitectura e inyección de dependencias | `AppContext`, `module-info`, `pom.xml` |\n| 3 | Base de datos y repositorios | `schema_celmax.sql`, `SqlHelper`, `AbstractJpaRepository` |\n| 4 | CRUD, validaciones y vistas | `ClienteController`, `FormHelper`, FXML, CSS |\n| 5 | Proceso de venta y transacción | `VentaController`, `VentaServiceImp`, `VentaRepository` |\n\n## Cómo estudiar el código (método)\n\n1. **De afuera hacia adentro:** primero la pantalla, luego el controlador, luego el servicio,\n   luego el repositorio y al final el SQL.\n2. **Sigue un solo dato:** por ejemplo el DNI de un cliente. ¿En qué `TextField` entra? ¿En qué\n   atributo del modelo se guarda? ¿En qué columna termina?\n3. **Usa el depurador:** pon un *breakpoint* en `ClienteController.validarFormulario()` y avanza\n   con F8/F10 para ver cada paso.\n4. **Cambia algo pequeño y observa:** cambia un mensaje de validación o un color del CSS y vuelve\n   a ejecutar.\n5. **Explícalo en voz alta:** si puedes explicar un archivo a un compañero en 1 minuto, lo entendiste.\n"}, {"id": "02", "title": "2. Visión general — ¿Qué es CelMax?", "md": "# 2. Visión general — ¿Qué es CelMax?\n\n**CelMax** es una tienda (ficticia) que vende **celulares de última generación** y\n**accesorios** (fundas, micas, cargadores, audífonos…) en varias **sucursales** del Perú.\n\nLa aplicación es un **sistema de escritorio** para que los trabajadores:\n\n- registren clientes, celulares, accesorios y sucursales;\n- controlen el **inventario** (stock y precio de cada celular en cada tienda);\n- registren **ventas** con cálculo automático de **IGV (18 %)**;\n- consulten el **historial** de ventas y su detalle.\n\n## Tecnologías\n\n| Tecnología | Para qué |\n|------------|----------|\n| **Java 21** | Lenguaje |\n| **JavaFX 21 + FXML + CSS** | Interfaz gráfica de escritorio |\n| **Maven** | Descargar librerías, compilar y ejecutar (`pom.xml`) |\n| **H2** | Base de datos que vive en un archivo (`data/celmax.mv.db`), no hay que instalar nada |\n| **HikariCP** | Pool de conexiones a la base de datos |\n| **JDBC** | Ejecutar SQL desde Java (sin Hibernate/JPA) |\n| **Lombok** | Genera getters, setters, constructores y *builders* |\n| **Jakarta Validation** | Validar formularios con anotaciones (`@NotBlank`, `@Email`…) |\n\nLa estructura es **la misma del proyecto SysVentas** trabajado en clase\n(repositorio `POO2026-2-G3`, rama `dev-Sesion11`).\n\n## Perfiles y qué puede hacer cada uno\n\n```mermaid\nflowchart TB\n    A[Administrador] --> P1[Todo el sistema]\n    G[Gerente] --> P2[Catálogo, almacén, clientes, historial]\n    V[Vendedor] --> P3[Clientes, registrar venta, historial]\n```\n\n| Menú → opción | Administrador | Gerente | Vendedor |\n|---------------|:---:|:---:|:---:|\n| Principal → Inicio / Cerrar sesión | ✔ | ✔ | ✔ |\n| Catálogo → Celulares, Accesorios | ✔ | ✔ | |\n| Almacén → Sucursales, Inventario | ✔ | ✔ | |\n| Ventas → Clientes, Historial | ✔ | ✔ | ✔ |\n| Ventas → Registrar venta | ✔ | | ✔ |\n| Administración → Usuarios | ✔ | | |\n\n## Pantallas\n\n| Pantalla | Qué se hace | Archivo FXML | Controlador |\n|----------|-------------|--------------|-------------|\n| Login | Ingresar con usuario y contraseña | `login.fxml` | `LoginController` |\n| Principal | Cabecera, menú por perfil y pestañas | `maingui.fxml` | `MainguiController` |\n| Inicio | Tarjetas de resumen, últimas ventas, stock bajo | `main_inicio.fxml` | `InicioController` |\n| Clientes | CRUD de clientes | `main_cliente.fxml` | `ClienteController` |\n| Celulares | CRUD de modelos de celular | `main_celular.fxml` | `CelularController` |\n| Accesorios | CRUD de accesorios (stock bajo en rojo) | `main_accesorio.fxml` | `AccesorioController` |\n| Sucursales | CRUD de tiendas | `main_sucursal.fxml` | `SucursalController` |\n| Inventario | Stock y precio de cada celular por sucursal | `main_inventario.fxml` | `InventarioController` |\n| Usuarios | CRUD de usuarios y su perfil | `main_usuario.fxml` | `UsuarioController` |\n| Registrar venta | Carrito, totales e IGV | `main_venta.fxml` | `VentaController` |\n| Historial | Ventas y su detalle | `main_historial.fxml` | `HistorialVentaController` |\n\n> **CRUD** = *Create, Read, Update, Delete* (registrar, listar, editar, eliminar).\n\n## Idea clave del negocio\n\n- Un **celular** no tiene precio propio: su precio y stock dependen de la **sucursal**\n  (tabla `Inventario`). El mismo iPhone puede costar distinto en Lima y en Cusco.\n- Un **accesorio** sí tiene su propio precio y stock.\n- Cada línea de una venta (`DetalleVenta`) es **un celular o un accesorio**, nunca los dos.\n- Los precios **ya incluyen IGV**; el sistema separa el neto y el IGV al final.\n"}, {"id": "03", "title": "3. Arquitectura — capas, paquetes y patrones", "md": "# 3. Arquitectura — capas, paquetes y patrones\n\n## 3.1 Arquitectura en capas\n\nCada capa **solo conoce a la capa de abajo**. Así, si mañana cambiamos H2 por PostgreSQL,\nsolo se toca la capa de datos.\n\n```mermaid\nflowchart TB\n    V[\"VISTA<br/>FXML + CSS<br/>(lo que ve el usuario)\"]\n    C[\"CONTROLADOR<br/>controller/*Controller<br/>(eventos de la pantalla)\"]\n    S[\"SERVICIO<br/>service/I*Service + impl/*ServiceImp<br/>(reglas de negocio)\"]\n    R[\"REPOSITORIO<br/>repository/*Repository<br/>(SQL con JDBC)\"]\n    D[(\"BASE DE DATOS H2<br/>data/celmax.mv.db\")]\n    M[\"MODELO<br/>model/*<br/>(una clase por tabla)\"]\n\n    V -- \"clic / onAction\" --> C\n    C --> S\n    S --> R\n    R -- \"PreparedStatement\" --> D\n    M -.viaja entre capas.- C\n    M -.- S\n    M -.- R\n```\n\nVersión en texto (por si el diagrama no se dibuja):\n\n```\n Pantalla (FXML) ──► Controller ──► Service ──► Repository ──► H2\n        ▲                                                       │\n        └──────────── objetos del Model (Cliente, Venta…) ◄─────┘\n```\n\n| Capa | Responsabilidad | Ejemplo |\n|------|-----------------|---------|\n| **Vista** | Mostrar datos y recibir clics | `main_cliente.fxml` |\n| **Controlador** | Leer los campos, validar, llamar al servicio, refrescar la tabla | `ClienteController` |\n| **Servicio** | Reglas del negocio (IGV, stock, “no existe el ID”) | `VentaServiceImp.calcularTotales()` |\n| **Repositorio** | Traducir objetos ⇄ filas SQL | `ClienteRepository.insert()` |\n| **Modelo** | Representar una tabla como clase Java | `Cliente` |\n\n## 3.2 Paquetes del proyecto\n\n```\npe.edu.upeu.celmax\n├── App / CelMax        arranque (main → Application JavaFX → login)\n├── config              AppContext (inyección de dependencias), DatabaseConfig (H2 + Hikari)\n├── model               Categoria, Perfil, Usuario, Cliente, Celular, Accesorio,\n│                       Sucursal, Inventario, Venta, DetalleVenta\n├── repository          ICrudGenericoRepository, AbstractJpaRepository, *Repository\n│   └── helper          SqlHelper (JDBC puro)\n├── service             I*Service (interfaces), ICrudGenericoService\n│   └── impl            *ServiceImp, CrudGenericoServiceImp, MenuMenuItemDaoImp\n├── controller          un controlador por pantalla\n├── components          TableViewHelper, FormHelper, Toast, ToltipCustom, ColumnInfo, StageManager\n├── dto                 ComboBoxOption, ProductoVenta, SessionManager, MenuMenuItenTO\n├── enums               TipoProducto (CELULAR / ACCESORIO)\n├── exception           ModelNotFoundException\n└── utils               UtilsX (lee los archivos de idioma)\n```\n\nRecursos (`src/main/resources`): `view/*.fxml`, `css/*.css`, `img/`, `application.properties`,\n`schema_celmax.sql`, `data_celmax.sql`.\n\n## 3.3 Inyección de dependencias manual (`AppContext`)\n\nEn lugar de usar Spring, el proyecto arma todos los objetos **una sola vez** en `AppContext`\ny los guarda en un `Map<Class, Object>`.\n\n```mermaid\nflowchart LR\n    subgraph AppContext\n      direction TB\n      R1[ClienteRepository] --> S1[ClienteServiceImp]\n      S1 --> C1[ClienteController]\n    end\n    F[FXMLLoader] -- \"setControllerFactory(appContext::getBean)\" --> AppContext\n```\n\n1. `registrarRepositorios()` crea los repositorios.\n2. `registrarServicios()` crea cada servicio **pasándole su repositorio por el constructor**.\n3. `registrarControladores()` crea cada controlador **pasándole sus servicios**.\n4. Cuando JavaFX carga un `.fxml`, el `FXMLLoader` pide el controlador a `AppContext.getBean()`.\n\nPor eso los controladores tienen `@RequiredArgsConstructor` (Lombok crea el constructor con los\natributos `final`).\n\n## 3.4 Jerarquía genérica (lo más importante para entender el código)\n\n```mermaid\nclassDiagram\n    class ICrudGenericoRepository~T,ID~ {\n      <<interface>>\n      +save(T) T\n      +update(T) T\n      +findById(ID) Optional~T~\n      +findAll() List~T~\n      +deleteById(ID)\n      +existsById(ID) boolean\n    }\n    class SqlHelper~T~ {\n      <<abstract>>\n      #executeQuery(sql, params) List~T~\n      #executeUpdate(conn, sql, params)\n      #nextCode(conn, tabla, pk, prefijo, digitos) String\n      #mapRow(ResultSet) T*\n    }\n    class AbstractJpaRepository~T,ID~ {\n      <<abstract>>\n      +save(T) T\n      +findAll() List~T~\n      #getTableName() String*\n      #getPkColumn() String*\n      #insert(conn, T) T*\n      #updateRow(conn, T) T*\n    }\n    class ClienteRepository\n    class VentaRepository\n\n    SqlHelper <|-- AbstractJpaRepository\n    ICrudGenericoRepository <|.. AbstractJpaRepository\n    AbstractJpaRepository <|-- ClienteRepository\n    AbstractJpaRepository <|-- VentaRepository\n```\n\n- `SqlHelper` sabe **ejecutar SQL** (abre conexión, pone parámetros `?`, recorre el `ResultSet`).\n- `AbstractJpaRepository` implementa el CRUD **una sola vez** para todas las tablas.\n- Cada repositorio concreto solo dice: nombre de la tabla, nombre de la PK, cómo insertar,\n  cómo actualizar y cómo convertir una fila en objeto (`mapRow`).\n\nLo mismo pasa en servicios:\n\n```mermaid\nclassDiagram\n    class ICrudGenericoService~T,ID~ {\n      <<interface>>\n      +save(T) T\n      +update(ID, T) T\n      +findAll() List~T~\n      +findById(ID) T\n      +delete(ID)\n    }\n    class CrudGenericoServiceImp~T,ID~ {\n      <<abstract>>\n      #getRepo() ICrudGenericoRepository*\n    }\n    class IClienteService {\n      <<interface>>\n      +listarCombobox() List\n    }\n    class ClienteServiceImp\n    ICrudGenericoService <|.. CrudGenericoServiceImp\n    ICrudGenericoService <|-- IClienteService\n    CrudGenericoServiceImp <|-- ClienteServiceImp\n    IClienteService <|.. ClienteServiceImp\n```\n\n## 3.5 Patrones de diseño usados\n\n| Patrón | Dónde | Idea |\n|--------|-------|------|\n| **Singleton** | `AppContext`, `SessionManager`, `DatabaseConfig` | Una sola instancia para toda la app |\n| **Template Method** | `AbstractJpaRepository.save()` llama a `insert()` | El algoritmo general está en la clase padre; los pasos los define el hijo |\n| **Repository** | `*Repository` | Esconde el SQL detrás de métodos como `findAll()` |\n| **Inyección de dependencias** | `AppContext` + constructores | Los objetos reciben lo que necesitan, no lo crean |\n| **MVC** | FXML (vista) + Controller + Model | Separar pantalla, lógica y datos |\n| **Builder** | `Cliente.builder().dni(..).build()` (Lombok) | Crear objetos legibles con muchos atributos |\n| **DTO** | `ProductoVenta`, `ComboBoxOption` | Objetos solo para transportar datos a la pantalla |\n\n## 3.6 `module-info.java` en una línea cada uno\n\n- `requires javafx.controls / javafx.fxml` → usamos JavaFX.\n- `requires java.sql, com.zaxxer.hikari, com.h2database` → base de datos.\n- `requires jakarta.validation` → validaciones; `requires static lombok` → solo al compilar.\n- `opens ...controller to javafx.fxml` → el FXMLLoader puede inyectar los `@FXML`.\n- `opens ...model` y `opens ...dto` → las tablas (`TableView`) pueden leer los getters por reflexión.\n"}, {"id": "04", "title": "4. Base de datos", "md": "# 4. Base de datos\n\n- **Motor:** H2 en archivo → `Proyecto/CelMax/data/celmax.mv.db` (se crea solo).\n- **Modelo:** `Proyecto/db/trabajo_celmax.architect` (se abre con SQL Power Architect).\n- **Scripts:** `schema_celmax.sql` (tablas) y `data_celmax.sql` (datos del Excel).\n- **Diccionario completo:** `Proyecto/db/BASE_DATOS.md`.\n\n## 4.1 Diagrama entidad–relación\n\n```mermaid\nerDiagram\n    Perfil ||--o{ Usuario : \"tiene\"\n    Usuario ||--o{ Venta : \"registra\"\n    Cliente ||--o{ Venta : \"compra\"\n    Venta ||--|{ DetalleVenta : \"contiene\"\n    Celular |o--o{ DetalleVenta : \"se vende en\"\n    Accesorio |o--o{ DetalleVenta : \"se vende en\"\n    Categoria ||--o{ Celular : \"clasifica\"\n    Categoria ||--o{ Accesorio : \"clasifica\"\n    Celular ||--o{ Inventario : \"se guarda en\"\n    Sucursal ||--o{ Inventario : \"almacena\"\n\n    Perfil {\n        varchar idPerfil PK\n        varchar nombrePerfil\n    }\n    Usuario {\n        varchar idUsuario PK\n        varchar nombreUsuario\n        varchar contrasena\n        varchar idPerfil FK\n    }\n    Cliente {\n        varchar idCliente PK\n        char dni\n        varchar nombre\n        char celular\n        varchar correo\n    }\n    Venta {\n        varchar idVenta PK\n        varchar idCliente FK\n        date fechaVenta\n        decimal pNeto\n        decimal igv\n        decimal pTotal\n        varchar idUsuario FK\n    }\n    DetalleVenta {\n        varchar idDetalle PK\n        varchar idVenta FK\n        varchar idCelular FK\n        varchar idAccesorio FK\n        int cantidad\n        decimal precioUnitario\n        decimal subtotal\n    }\n    Celular {\n        varchar idCelular PK\n        varchar modelo\n        varchar marca\n        int almacenamiento\n        int ram\n        varchar idCategoria FK\n    }\n    Accesorio {\n        varchar idAccesorio PK\n        varchar nombre\n        varchar tipo\n        decimal precio\n        int stock\n        int stockMinimo\n        varchar idCategoria FK\n    }\n    Categoria {\n        varchar idCategoria PK\n        varchar nombre\n    }\n    Sucursal {\n        varchar idSucursal PK\n        int numeroTienda\n        varchar ciudad\n        varchar tipo\n    }\n    Inventario {\n        varchar idInventario PK\n        varchar idCelular FK\n        varchar idSucursal FK\n        date fechaIngreso\n        int stock\n        decimal precio\n    }\n```\n\n## 4.2 Las 10 tablas en una frase\n\n| Tabla | Qué guarda | Ejemplo |\n|-------|-----------|---------|\n| Categoria | Celulares o Accesorios | `CAT-01` Celulares |\n| Perfil | Rol del usuario | `PF-03` Vendedor |\n| Usuario | Trabajadores que entran al sistema | `USR-03` Bernabe |\n| Cliente | Personas que compran | `CLI-001` Rosa Villanueva |\n| Celular | Modelos de celular (sin precio) | `CEL-001` iPhone 17 Pro |\n| Accesorio | Accesorios con precio y stock | `ACC-002` Mica de vidrio |\n| Sucursal | Tiendas | `SUC-01` Lima, Flagship |\n| Inventario | Stock y precio de un celular en una sucursal | `INV-001` iPhone en Lima, 12 und, S/ 5499 |\n| Venta | Cabecera: cliente, vendedor, fecha, totales | `VTA-001` S/ 1424.00 |\n| DetalleVenta | Cada producto vendido en una venta | `DET-001` 1 Honor 400 |\n\n## 4.3 Claves y relaciones\n\n- **PK (clave primaria):** identifica una fila. Aquí son **códigos de texto** (`CEL-001`), igual\n  que en el Excel. El método `SqlHelper.nextCode()` busca el mayor código y genera el siguiente.\n- **FK (clave foránea):** apunta a la PK de otra tabla. Ej.: `Venta.idCliente → Cliente.idCliente`.\n- **1 a muchos (1:N):** un cliente tiene muchas ventas; una venta tiene muchos detalles.\n- **Tabla intermedia:** `Inventario` resuelve la relación **muchos a muchos** entre\n  `Celular` y `Sucursal` (un celular está en varias tiendas y una tienda tiene varios celulares)\n  y además guarda datos propios: stock, precio y fecha de ingreso.\n- **Regla CHECK** en `DetalleVenta`: `idCelular` **o** `idAccesorio`, exactamente uno.\n\n## 4.4 Reglas de negocio\n\n1. **IGV:** los precios incluyen IGV.\n   ```\n   pTotal = suma de subtotales\n   pNeto  = pTotal / 1.18\n   igv    = pTotal - pNeto\n   Ejemplo VTA-001: 1424.00 → neto 1206.78 + IGV 217.22\n   ```\n2. **Stock:** vender un celular descuenta de su fila de `Inventario`; vender un accesorio\n   descuenta de `Accesorio.stock`. Si no alcanza, la venta **entera** se cancela.\n3. **Stock bajo:** un accesorio con `stock <= stockMinimo` aparece en rojo y en la pantalla de inicio.\n4. **Integridad:** no se puede borrar un celular que ya se vendió (la FK lo impide) y el sistema\n   muestra un mensaje amigable.\n\n## 4.5 Cómo se crea la base al arrancar\n\n```mermaid\nflowchart TD\n    A[Primera consulta a la BD] --> B[DatabaseConfig.init]\n    B --> C[Leer application.properties]\n    C --> D[Crear pool HikariCP]\n    D --> E[\"Ejecutar schema_celmax.sql<br/>CREATE TABLE IF NOT EXISTS\"]\n    E --> F{¿Tabla Perfil vacía?}\n    F -- Sí, BD nueva --> G[Ejecutar data_celmax.sql]\n    F -- No --> H[Listo]\n    G --> H\n```\n\nPara **reiniciar los datos** basta con cerrar la app y borrar la carpeta `Proyecto/CelMax/data/`.\n"}, {"id": "05", "title": "5. Recorrido del código — ¿qué pasa cuando…?", "md": "# 5. Recorrido del código — ¿qué pasa cuando…?\n\nAquí se sigue el camino de **cuatro acciones** reales, archivo por archivo.\nRutas relativas a `Proyecto/CelMax/src/main/java/pe/edu/upeu/celmax/`.\n\n---\n\n## 5.1 …se abre la aplicación\n\n```mermaid\nsequenceDiagram\n    participant M as App.main()\n    participant FX as CelMax (Application)\n    participant CTX as AppContext\n    participant L as FXMLLoader\n    M->>FX: Application.launch(CelMax.class)\n    FX->>CTX: AppContext.getInstance()\n    Note over CTX: crea repositorios, servicios<br/>y controladores (una sola vez)\n    FX->>L: new FXMLLoader(\"/view/login.fxml\")\n    FX->>L: setControllerFactory(ctx::getBean)\n    L->>CTX: getBean(LoginController.class)\n    L-->>FX: Parent (pantalla de login)\n    FX->>FX: Scene + style.css → stage.show()\n```\n\n1. `App.main()` solo llama a `Application.launch(CelMax.class)`.\n2. `CelMax.start()` obtiene el `AppContext`, carga `login.fxml`, le aplica `style.css` y muestra la ventana.\n3. La base de datos **aún no se abre**: se abre en la primera consulta (el login).\n\n---\n\n## 5.2 …el usuario inicia sesión\n\n```mermaid\nsequenceDiagram\n    actor U as Usuario\n    participant LC as LoginController\n    participant US as UsuarioServiceImp\n    participant UR as UsuarioRepository\n    participant DB as H2\n    U->>LC: escribe usuario/clave y pulsa Ingresar\n    LC->>US: loginUsuario(\"Isaac\", \"Is@c5G#01\")\n    US->>UR: findByUsuarioAndClave(...)\n    UR->>DB: SELECT u.*, p.nombrePerfil FROM Usuario u JOIN Perfil p ... WHERE ...\n    DB-->>UR: 1 fila\n    UR-->>US: Optional de Usuario (mapRow)\n    US-->>LC: Optional de Usuario\n    alt encontrado\n        LC->>LC: SessionManager guarda id, nombre y perfil\n        LC->>LC: carga maingui.fxml (ventana principal)\n    else no encontrado\n        LC->>U: \"Usuario o contraseña incorrectos\"\n    end\n```\n\nDespués, `MainguiController.initialize()`:\n\n1. Muestra el usuario y su perfil en la cabecera.\n2. Llama a `graficarMenus()`, que pide a `MenuMenuItemDaoImp.listaAccesos(perfil, idioma)`\n   la lista de opciones permitidas y arma el `MenuBar` por código.\n3. Abre la pestaña **Inicio**.\n\nAl hacer clic en un menú, `MenuItemListener.handle()` mira el tipo:\n`\"T\"` → abre el FXML en una **pestaña**; `\"C\"` → **cierra sesión** y vuelve al login.\n\n---\n\n## 5.3 …se guarda un cliente (CRUD típico)\n\nTodos los CRUD (clientes, celulares, accesorios, sucursales, inventario, usuarios) funcionan **igual**.\n\n```mermaid\nsequenceDiagram\n    actor U as Usuario\n    participant V as main_cliente.fxml\n    participant C as ClienteController\n    participant FH as FormHelper\n    participant S as ClienteServiceImp\n    participant R as ClienteRepository\n    participant DB as H2\n    U->>V: llena el formulario y pulsa Guardar\n    V->>C: validarFormulario()  (onAction)\n    C->>C: arma Cliente con Cliente.builder()\n    C->>FH: validar(cliente)  (Jakarta Validation)\n    alt hay errores\n        FH-->>C: lista de errores\n        C->>FH: mostrarErrores() → borde rojo + mensaje\n    else sin errores\n        C->>S: save(cliente)  o  update(id, cliente)\n        S->>R: save(cliente)\n        R->>R: abre conexión, setAutoCommit(false)\n        R->>DB: nextCode → \"CLI-006\"\n        R->>DB: INSERT INTO Cliente(...) VALUES(?,?,?,?,?)\n        R->>DB: commit\n        C->>FH: toastOk(\"Cliente registrado: CLI-006\")\n        C->>C: clearForm() y listar()\n    end\n```\n\nPuntos a explicar en la exposición:\n\n- `@FXML TextField txtDni` se conecta con `fx:id=\"txtDni\"` del FXML.\n- `onAction=\"#validarFormulario\"` llama al método del mismo nombre.\n- Las reglas (`@Pattern(regexp=\"\\\\d{8}\")` para el DNI) están **en el modelo**, no en el controlador.\n- **Editar:** el botón ✎ de la tabla llama a `editForm()`, que llena el formulario y guarda el\n  id en `idClienteCE`; al guardar, si `idClienteCE != null` se hace `update` en vez de `save`.\n- **Eliminar:** el botón ✖ pide confirmación; si la BD rechaza el borrado por una FK,\n  `FormHelper.mensajeError()` lo traduce a un mensaje entendible.\n- Los botones ✎ ✖ y las columnas los crea `TableViewHelper` a partir de un `LinkedHashMap`\n  “título → atributo”.\n\n---\n\n## 5.4 …se registra una venta (lo más importante)\n\n### Paso A: armar el carrito (solo en memoria)\n\n```mermaid\nflowchart TD\n    A[initialize] --> B[\"cbxCliente ← clienteService.listarCombobox()\"]\n    A --> C[\"cbxProducto ← ventaService.listarProductosVenta()<br/>celulares desde Inventario + accesorios\"]\n    D[Clic en Agregar] --> E{¿producto y cantidad válidos?}\n    E -- No --> F[mensaje en rojo]\n    E -- Sí --> G{¿cantidad + lo que ya está<br/>en el carrito ≤ stock?}\n    G -- No --> H[Stock insuficiente]\n    G -- Sí --> I{¿ya está en el carrito?}\n    I -- Sí --> J[sumar cantidad y subtotal]\n    I -- No --> K[nuevo DetalleVenta]\n    J --> L[calcularTotales → neto, IGV, total]\n    K --> L\n```\n\n- El carrito es una `ObservableList<DetalleVenta>`: la tabla se actualiza sola al agregar o quitar.\n- `ProductoVenta` (paquete `dto`) es lo que se muestra en el combo: tipo, descripción,\n  precio, stock e `idInventario` (para saber de qué sucursal sale el celular).\n\n### Paso B: confirmar la venta (una transacción)\n\n```mermaid\nsequenceDiagram\n    participant VC as VentaController\n    participant VS as VentaServiceImp\n    participant VR as VentaRepository\n    participant DB as H2\n    VC->>VS: registrarVenta(cliente, vendedor, carrito)\n    VS->>VS: calcularTotales() → neto, igv, total\n    VS->>VR: save(venta)\n    VR->>DB: setAutoCommit(false)  (inicia transacción)\n    VR->>DB: INSERT INTO Venta ...  (VTA-006)\n    loop por cada línea del carrito\n        VR->>DB: INSERT INTO DetalleVenta ...\n        VR->>DB: UPDATE Inventario/Accesorio SET stock = stock - ? WHERE ... AND stock >= ?\n        alt 0 filas actualizadas (no hay stock)\n            VR->>DB: ROLLBACK (se deshace TODO)\n            VR-->>VC: excepción \"Stock insuficiente...\"\n        end\n    end\n    VR->>DB: COMMIT\n    VR-->>VC: venta con su código\n    VC->>VC: toast \"Venta VTA-006 registrada\" y limpiar()\n```\n\n**¿Por qué una transacción?** Porque la venta son varias operaciones (cabecera, detalles y\nstock). O se guardan **todas**, o **ninguna**. Si fallara a la mitad sin transacción, quedaría\nuna venta sin detalle o un stock descontado sin venta.\n\nEl truco está en `AbstractJpaRepository.save()`:\n\n```java\nconn.setAutoCommit(false);\ntry {\n    T result = insert(conn, entity);   // VentaRepository.insert hace todo el trabajo\n    conn.commit();\n    return result;\n} catch (Exception e) {\n    conn.rollback();                   // si algo falla, se deshace todo\n    throw e;\n}\n```\n\n---\n\n## 5.5 Mapa rápido: “quiero cambiar X, ¿dónde voy?”\n\n| Quiero… | Archivo |\n|---------|---------|\n| Cambiar colores o tipografía | `resources/css/style.css` (y `estilo-oscuro.css`) |\n| Mover un campo de una pantalla | `resources/view/main_*.fxml` |\n| Cambiar un mensaje de validación | `model/<Entidad>.java` (anotaciones) |\n| Cambiar qué menús ve un perfil | `service/impl/MenuMenuItemDaoImp.java` |\n| Cambiar la tasa de IGV | `service/IVentaService.java` → `TASA_IGV` |\n| Cambiar un SQL | `repository/<Entidad>Repository.java` |\n| Agregar/quitar columnas de una tabla en pantalla | `controller/<Entidad>Controller.initialize()` |\n| Cambiar los datos iniciales | `resources/data_celmax.sql` (y borrar la carpeta `data/`) |\n| Cambiar los textos del menú | `language/idiomas-es.properties` / `idiomas-en.properties` |\n"}, {"id": "06", "title": "6. Conceptos de POO aplicados en CelMax", "md": "# 6. Conceptos de POO aplicados en CelMax\n\nCada concepto con **dónde está en el código**, para poder señalarlo en la exposición.\n\n## 6.1 Clase y objeto\n\nUna **clase** es el molde; un **objeto** es una instancia concreta.\n\n```java\npublic class Cliente {            // clase\n    private String idCliente;\n    private String dni;\n    ...\n}\nCliente c = Cliente.builder().dni(\"45172983\").nombre(\"Rosa\").build();  // objeto\n```\n\n## 6.2 Encapsulamiento\n\nLos atributos son `private` y se accede con getters/setters. Lombok los genera con `@Data`:\n\n```java\n@Data @Builder @NoArgsConstructor @AllArgsConstructor\npublic class Accesorio {\n    private Integer stock;\n    private Integer stockMinimo;\n    public boolean isStockBajo() { return stock <= stockMinimo; }   // comportamiento propio\n}\n```\n\nTambién en `DatabaseConfig`: el pool `dataSource` es `private static` y solo se entrega con\n`getConnection()`.\n\n## 6.3 Herencia\n\nUna clase hija **reutiliza** lo de la clase padre (`extends`).\n\n```\nSqlHelper<T>\n   └── AbstractJpaRepository<T, ID>\n          ├── ClienteRepository\n          ├── CelularRepository\n          └── VentaRepository ...\n```\n\n`ClienteRepository` no escribe `findAll()`, `save()` ni `deleteById()`: los **hereda**.\n\n## 6.4 Abstracción y clases abstractas\n\n`AbstractJpaRepository` es `abstract`: no se puede instanciar y obliga a los hijos a\nimplementar los métodos abstractos.\n\n```java\nprotected abstract String getTableName();\nprotected abstract T insert(Connection conn, T entity) throws SQLException;\nprotected abstract T mapRow(ResultSet rs) throws SQLException;\n```\n\n## 6.5 Interfaces\n\nUna **interfaz** es un contrato: qué se puede hacer, sin decir cómo.\n\n```java\npublic interface IClienteService extends ICrudGenericoService<Cliente, String> {\n    List<ComboBoxOption> listarCombobox();\n}\npublic class ClienteServiceImp extends CrudGenericoServiceImp<Cliente, String>\n        implements IClienteService { ... }\n```\n\nLos controladores dependen de la **interfaz** (`IClienteService`), no de la implementación.\n\n## 6.6 Polimorfismo\n\n- **Sobrescritura (`@Override`):** `VentaRepository` sobrescribe `findAll()` para hacer un JOIN\n  con Cliente y Usuario; el resto de código sigue llamando a `findAll()` sin saber la diferencia.\n- **Por interfaz:** `AppContext.getBean(IVentaService.class)` devuelve un `VentaServiceImp`,\n  pero se usa como `IVentaService`.\n- **Sobrecarga:** `TableViewHelper.addColumnsInOrderWithSize(...)` existe con 2 y con 4 parámetros.\n\n## 6.7 Genéricos\n\n`<T, ID>` permite escribir el CRUD **una sola vez** para cualquier entidad:\n\n```java\npublic interface ICrudGenericoRepository<T, ID> {\n    T save(T entity);\n    Optional<T> findById(ID id);\n    List<T> findAll();\n}\n// T = Cliente, ID = String\npublic class ClienteRepository extends AbstractJpaRepository<Cliente, String> { ... }\n```\n\n## 6.8 Composición / asociación\n\nUn objeto **contiene** a otro:\n\n- `Venta` tiene un `Cliente`, un `Usuario` y una `List<DetalleVenta>`.\n- `Inventario` tiene un `Celular` y una `Sucursal`.\n- `ClienteController` tiene un `IClienteService` (se lo pasan por el constructor).\n\n## 6.9 Enumeraciones\n\n```java\npublic enum TipoProducto { CELULAR, ACCESORIO }\n```\nSe usa en `ProductoVenta` para saber si se descuenta stock de `Inventario` o de `Accesorio`.\n\n## 6.10 Excepciones\n\n- `ModelNotFoundException extends RuntimeException`: la lanza el servicio cuando el ID no existe.\n- `try / catch` en los controladores: si algo falla se muestra un mensaje en vez de cerrar la app.\n- `try-with-resources` en `SqlHelper`: la conexión se cierra sola.\n\n```java\ntry (Connection conn = openConnection();\n     PreparedStatement ps = conn.prepareStatement(sql)) { ... }\n```\n\n## 6.11 `static` y Singleton\n\n```java\npublic static synchronized AppContext getInstance() {\n    if (instance == null) instance = new AppContext();\n    return instance;\n}\n```\n`static` pertenece a la clase, no al objeto. El constructor es `private` → nadie más puede crear otro.\n\n## 6.12 Lambdas y referencias a métodos\n\n```java\ntxtFiltroDato.textProperty().addListener((obs, viejo, nuevo) -> filtrar(nuevo));  // lambda\nnew TableViewHelper<Cliente>().addColumnsInOrderWithSize(tableView, columns,\n        this::editForm, this::eliminar);                                         // referencia a método\nfxmlLoader.setControllerFactory(appContext::getBean);\n```\n\n## 6.13 `Optional`\n\nEvita los `null`: `findById()` devuelve `Optional<T>`.\n\n```java\nus.loginUsuario(usuario, clave).ifPresentOrElse(\n    u -> abrirPantalla(e, u),\n    () -> lblError.setText(\"Usuario o contraseña incorrectos\"));\n```\n\n## 6.14 Anotaciones\n\n| Anotación | Quién la usa | Para qué |\n|-----------|--------------|----------|\n| `@Data`, `@Builder`, `@RequiredArgsConstructor` | Lombok | Generar código repetitivo |\n| `@NotBlank`, `@Pattern`, `@Email`, `@Positive` | Jakarta Validation | Validar formularios |\n| `@FXML` | JavaFX | Conectar atributos y métodos con el FXML |\n| `@Override` | Compilador | Verificar que se sobrescribe un método |\n"}, {"id": "07", "title": "7. Ejecutar el proyecto y errores comunes", "md": "# 7. Ejecutar el proyecto y errores comunes\n\n## 7.1 Requisitos\n\n| Programa | Versión | Cómo comprobar |\n|----------|---------|----------------|\n| JDK | **21** | `java -version` |\n| Maven | 3.8 o superior (o usar `mvnw.cmd` incluido) | `mvn -v` |\n| IDE | IntelliJ IDEA o VS Code con *Extension Pack for Java* | — |\n\nLa primera vez Maven descarga las librerías de internet (unos minutos).\n\n## 7.2 Ejecutar\n\n1. Descomprimir el ZIP.\n2. Abrir una terminal **dentro de** `Proyecto/CelMax` (la carpeta que tiene `pom.xml`).\n3. Ejecutar:\n   ```bash\n   mvn javafx:run\n   ```\n   Sin Maven instalado: `mvnw.cmd javafx:run` (Windows) o `./mvnw javafx:run` (Linux/Mac).\n\n**IntelliJ:** *File → Open* → elegir `Proyecto/CelMax` → panel *Maven* (derecha) →\n*Plugins → javafx → javafx:run*.\n\n**VS Code:** *File → Open Folder* → `Proyecto/CelMax` → terminal integrada → `mvn javafx:run`.\n\n## 7.3 Credenciales de prueba\n\n| Usuario | Contraseña | Perfil |\n|---------|------------|--------|\n| Isaac   | `Is@c5G#01`   | Administrador |\n| Jeremy  | `Jer*Pro15x`  | Gerente |\n| Bernabe | `Bern!Ultra7` | Vendedor |\n| Jhoner  | `Jh0n_Fold26` | Vendedor |\n\nEl usuario distingue mayúsculas y minúsculas (`Isaac`, no `isaac`).\n\n## 7.4 Errores comunes y solución\n\n| Mensaje | Causa | Solución |\n|---------|-------|----------|\n| `there is no POM in this directory` | La terminal no está en la carpeta del proyecto | `cd` hasta `Proyecto/CelMax` (donde está `pom.xml`) |\n| `Location is not set` al arrancar | Se ejecutó `mvn clean ...` con **VS Code abierto**: la extensión de Java recompila `target/` al mismo tiempo y borra los `.fxml` | Ejecutar **sin `clean`**: `mvn javafx:run`. Si hace falta limpiar, cerrar VS Code antes |\n| `invalid target release: 21` / `release version 21 not supported` | Maven usa un JDK antiguo | Instalar JDK 21 y apuntar `JAVA_HOME` a él (`mvn -v` debe decir 21) |\n| `Database may be already in use` | Hay otra ventana de CelMax abierta usando el mismo archivo H2 | Cerrar la otra ventana (o terminar el proceso `java`) |\n| Las tildes del menú salen raras | Archivo de idioma guardado con otra codificación | Guardar `language/*.properties` en UTF-8 |\n| No aparece el menú en inglés / sale vacío | Se ejecutó desde otra carpeta y no encuentra `language/` | Ejecutar desde `Proyecto/CelMax` |\n| Quiero volver a los datos originales | — | Cerrar la app y borrar la carpeta `Proyecto/CelMax/data/` |\n| `SLF4J: Failed to load class ...StaticLoggerBinder` | Aviso de logs, no es un error | Se puede ignorar |\n\n## 7.5 Ver la base de datos por dentro (opcional)\n\nH2 trae una consola web. Con la app **cerrada**:\n\n```bash\njava -cp %USERPROFILE%\\.m2\\repository\\com\\h2database\\h2\\2.4.240\\h2-2.4.240.jar org.h2.tools.Console\n```\n\nEn el navegador: JDBC URL `jdbc:h2:file:<ruta>/Proyecto/CelMax/data/celmax`, usuario `sa`,\nsin contraseña. Ahí se puede ejecutar `SELECT * FROM Venta;`.\n"}, {"id": "08", "title": "8. Preguntas de repaso y ejercicios", "md": "# 8. Preguntas de repaso y ejercicios\n\nIntenta responder **antes** de abrir la respuesta.\n\n## 8.1 Preguntas de repaso\n\n<details><summary><b>1.<\/b> ¿Cuáles son las capas del proyecto y qué hace cada una?<\/summary>\n\nVista (FXML/CSS: lo que se ve), Controlador (eventos de pantalla), Servicio (reglas de negocio),\nRepositorio (SQL con JDBC) y Modelo (clases que representan las tablas).\n<\/details>\n\n<details><summary><b>2.<\/b> ¿Qué hace <code>AppContext<\/code> y por qué no usamos <code>new<\/code> en los controladores?<\/summary>\n\nEs el contenedor de inyección de dependencias: crea una sola vez repositorios, servicios y\ncontroladores, y le pasa a cada uno lo que necesita por el constructor. El `FXMLLoader` le pide\nlos controladores con `setControllerFactory(appContext::getBean)`.\n<\/details>\n\n<details><summary><b>3.<\/b> ¿Por qué <code>ClienteRepository<\/code> no tiene un método <code>findAll()<\/code> propio y aun así funciona?<\/summary>\n\nPorque lo hereda de `AbstractJpaRepository`, que arma `SELECT * FROM` + `getTableName()`.\n<\/details>\n\n<details><summary><b>4.<\/b> ¿Para qué sirve <code>mapRow()<\/code>?<\/summary>\n\nConvierte una fila del `ResultSet` en un objeto Java (por ejemplo, una fila de `Cliente` en un\nobjeto `Cliente`).\n<\/details>\n\n<details><summary><b>5.<\/b> ¿Cómo se genera el código <code>CLI-006<\/code>?<\/summary>\n\n`SqlHelper.nextCode()` busca el mayor número de los códigos que empiezan con `CLI-`, le suma 1\ny lo rellena con ceros (`%03d`).\n<\/details>\n\n<details><summary><b>6.<\/b> ¿Por qué el celular no tiene precio en su tabla?<\/summary>\n\nPorque el precio y el stock dependen de la sucursal; se guardan en `Inventario`\n(Celular + Sucursal + stock + precio).\n<\/details>\n\n<details><summary><b>7.<\/b> Una venta de S/ 1424.00, ¿cuánto es el neto y el IGV?<\/summary>\n\nNeto = 1424 / 1.18 = **1206.78**; IGV = 1424 − 1206.78 = **217.22**.\n<\/details>\n\n<details><summary><b>8.<\/b> ¿Qué pasa si en una venta de 3 productos, el tercero no tiene stock?<\/summary>\n\nEl `UPDATE ... AND stock >= ?` no modifica filas, se lanza una excepción y se hace `rollback`:\nno se guarda ni la venta, ni los detalles, ni se descuenta el stock de los otros dos.\n<\/details>\n\n<details><summary><b>9.<\/b> ¿Dónde se decide qué menús ve un Vendedor?<\/summary>\n\nEn `MenuMenuItemDaoImp.listaAccesos()`, con un `switch` por nombre de perfil.\n<\/details>\n\n<details><summary><b>10.<\/b> ¿Cómo se conecta un botón del FXML con un método Java?<\/summary>\n\nCon `onAction=\"#nombreMetodo\"` en el FXML y un método con ese nombre (anotado `@FXML` o público)\nen el controlador indicado en `fx:controller`. Los campos se conectan con `fx:id` + `@FXML`.\n<\/details>\n\n<details><summary><b>11.<\/b> ¿Dónde están las reglas de validación de un cliente?<\/summary>\n\nEn el modelo `Cliente` con anotaciones: `@Pattern(regexp=\"\\\\d{8}\")` para el DNI,\n`@Email` para el correo, etc. `FormHelper.validar()` las ejecuta.\n<\/details>\n\n<details><summary><b>12.<\/b> ¿Qué es un DTO y cuál usamos?<\/summary>\n\nUn objeto solo para transportar datos. `ProductoVenta` junta lo que necesita el combo de la venta\n(tipo, descripción, precio, stock, idInventario); `ComboBoxOption` guarda clave y texto de un combo.\n<\/details>\n\n<details><summary><b>13.<\/b> ¿Por qué los datos de prueba no se vuelven a cargar cada vez que se abre la app?<\/summary>\n\n`DatabaseConfig` solo ejecuta `data_celmax.sql` si la tabla `Perfil` está vacía (base nueva).\nAsí no se pierden las ventas ni el stock.\n<\/details>\n\n<details><summary><b>14.<\/b> Diferencia entre <code>save()<\/code> y <code>update()<\/code> en el controlador.<\/summary>\n\nSi `id...CE` es `null` el registro es nuevo → `save()` (INSERT). Si tiene valor, se está editando\n→ `update(id, objeto)` (UPDATE).\n<\/details>\n\n## 8.2 Ejercicios prácticos (de menor a mayor dificultad)\n\n1. **Color:** cambia el color principal `-c-primary` en `style.css` y ejecuta.\n2. **Mensaje:** cambia el mensaje de error del DNI en `Cliente.java`.\n3. **Columna:** agrega la columna “Categoría” a la tabla de accesorios\n   (`AccesorioController.initialize()`, campo `idCategoria.nombre`).\n4. **Permiso:** haz que el Gerente también pueda ver *Usuarios* (`MenuMenuItemDaoImp`).\n5. **Validación:** en `Celular`, haz que la RAM no pueda ser mayor a 32 (`@Max(32)`).\n6. **Datos:** agrega un celular nuevo en `data_celmax.sql`, borra `data/` y ejecuta.\n7. **Filtro:** agrega un buscador a la pantalla de Sucursales (copia lo de Clientes).\n8. **Nueva tabla (reto):** crea la tabla `Marca` y conviértela en combo dentro de Celulares.\n   Sigue la receta del manual (`Proyecto/CelMax/docs/MANUAL_CELMAX.md`, sección 8):\n   modelo → repositorio → servicio → controlador → FXML → `AppContext` → menú → SQL.\n9. **Reporte (reto):** en Inicio, muestra el vendedor con más ventas.\n\n## 8.3 Autoevaluación\n\nMarca lo que ya puedes explicar sin mirar:\n\n- [ ] Dibujar el diagrama de capas.\n- [ ] Explicar el recorrido del botón **Guardar**.\n- [ ] Explicar la transacción de la venta.\n- [ ] Explicar herencia, interfaz y polimorfismo con un ejemplo del proyecto.\n- [ ] Explicar la relación Celular – Inventario – Sucursal.\n- [ ] Ejecutar el proyecto desde cero en otra computadora.\n"}]</script>

  const sec = document.createElement('section'); sec.id = 's' + s.id;
  if (window.marked) { sec.innerHTML = marked.parse(s.md); }
  else { const pre = document.createElement('pre'); pre.textContent = s.md; sec.appendChild(pre); }
  main.appendChild(sec);
});
document.querySelectorAll('pre code.language-mermaid').forEach(c => {
  const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = c.textContent;

});
if (window.mermaid) { mermaid.initialize({startOnLoad:false, theme:'default', securityLevel:'loose'}); mermaid.run(); }
const links = [...nav.querySelectorAll('a')];
addEventListener('scroll', () => {
